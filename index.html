<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>

<style>
:root{
  --bg:#f5f3ff; --bg2:#eef7ff; --card:rgba(255,255,255,.82);
  --solid:#fff; --ink:#17152b; --sub:#77738d; --line:#e8e4f2;
  --accent:#6c4df6; --accent2:#9b7cff; --accent-soft:#eeeaff;
  --success:#19b879; --success-soft:#e3f8ef;
  --danger:#e55367; --danger-soft:#ffe9ed;
  --shadow:0 18px 50px rgba(68,50,130,.12);
  --shadow-sm:0 8px 24px rgba(68,50,130,.08);
}
[data-theme="dark"]{
  --bg:#11101b; --bg2:#17142a; --card:rgba(29,27,45,.88);
  --solid:#1d1b2d; --ink:#f6f4ff; --sub:#aaa5bc; --line:#302c43;
  --accent:#8b72ff; --accent2:#b19dff; --accent-soft:#292342;
  --success:#35d495; --success-soft:#17382d;
  --danger:#ff7184; --danger-soft:#3b2028;
  --shadow:0 18px 55px rgba(0,0,0,.35);
  --shadow-sm:0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 5%, rgba(155,124,255,.25), transparent 28%),
    radial-gradient(circle at 92% 12%, rgba(76,191,255,.18), transparent 25%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  transition:background .3s,color .3s;
}
button,input{font:inherit}
button{ -webkit-tap-highlight-color:transparent }
.app{width:min(100%,920px);margin:auto;padding:34px 24px 120px;position:relative}
.hero{
  position:relative; overflow:hidden; padding:28px;
  border:1px solid rgba(255,255,255,.55); border-radius:30px;
  background:linear-gradient(135deg,rgba(108,77,246,.98),rgba(142,101,247,.88));
  box-shadow:0 22px 55px rgba(88,62,190,.28); color:white;
}
.hero:before,.hero:after{
  content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none
}
.hero:before{width:210px;height:210px;right:-80px;top:-105px}
.hero:after{width:150px;height:150px;left:42%;bottom:-110px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;position:relative;z-index:1}
.brand-row{display:flex;align-items:center;gap:13px}
.brand-icon{
  width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:rgba(255,255,255,.18);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.22);font-size:23px
}
h1{margin:0;font-size:clamp(1.65rem,4vw,2.15rem);letter-spacing:-.04em;font-weight:800}
.subtitle{margin:5px 0 0;color:rgba(255,255,255,.78);font-size:.91rem}
.theme-btn{
  width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:14px;
  background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(10px);transition:.2s
}
.theme-btn:hover{transform:rotate(8deg) scale(1.04);background:rgba(255,255,255,.22)}
.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-top:27px;position:relative;z-index:1}
.hero-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.68);font-weight:700}
.hero-count{font-size:2.25rem;line-height:1;font-weight:850;margin-top:5px;letter-spacing:-.06em}
.progress-wrap{width:min(320px,48%);text-align:right}
.progress-text{font-size:.78rem;color:rgba(255,255,255,.75);margin-bottom:8px}
.progress-bar{height:9px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:#fff;border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.content{margin-top:25px}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin:0 3px 12px}
.section-heading h2{font-size:1rem;margin:0;font-weight:800;letter-spacing:-.02em}
.count{font-size:.78rem;color:var(--sub);font-weight:700;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:10px}
.group-label{
  margin:23px 3px 10px;color:var(--sub);font-size:.73rem;text-transform:uppercase;
  letter-spacing:.12em;font-weight:800
}
.task{
  position:relative;display:flex;align-items:center;gap:14px;padding:15px 15px;
  min-height:66px;border:1px solid var(--line);border-radius:19px;
  background:var(--card);backdrop-filter:blur(14px);box-shadow:var(--shadow-sm);
  animation:taskIn .35s both;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;
}
.task:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:0 5px 5px 0;background:var(--accent);opacity:.0;transition:.2s}
.task:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(108,77,246,.25)}
.task:hover:before{opacity:1}
@keyframes taskIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.task.removing{animation:taskOut .22s forwards}
@keyframes taskOut{to{opacity:0;transform:translateX(24px) scale(.97);max-height:0;padding-top:0;padding-bottom:0;margin:0}}
.check{
  width:27px;height:27px;border-radius:10px;border:2px solid #d8d3e8;background:transparent;
  flex:none;cursor:pointer;display:grid;place-items:center;transition:.2s;position:relative
}
.check:hover{border-color:var(--accent);transform:scale(1.05)}
.task.done .check{background:var(--success);border-color:var(--success);transform:scale(1.02)}
.task.done .check:after{
  content:"";width:6px;height:11px;border:solid white;border-width:0 2.5px 2.5px 0;
  transform:rotate(43deg) translate(-1px,-1px)
}
.title{flex:1;font-size:.97rem;line-height:1.4;font-weight:650;word-break:break-word;transition:.2s}
.task.done .title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1.5px}
.del{
  width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--sub);
  cursor:pointer;display:grid;place-items:center;transition:.2s;flex:none
}
.del:hover{background:var(--danger-soft);color:var(--danger);transform:scale(1.06)}
.del svg{width:18px;height:18px}
.clear-row{text-align:right;margin:14px 2px 0}
.clear-btn{
  border:0;background:transparent;color:var(--sub);font-size:.78rem;font-weight:750;
  cursor:pointer;padding:8px 5px;border-radius:9px;transition:.2s
}
.clear-btn:hover{color:var(--danger);background:var(--danger-soft)}
.empty{
  min-height:300px;padding:46px 24px;text-align:center;border:1px dashed var(--line);
  border-radius:26px;background:rgba(255,255,255,.34);display:flex;flex-direction:column;align-items:center;justify-content:center
}
.empty-art{
  width:94px;height:94px;border-radius:30px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent-soft),rgba(255,255,255,.5));
  color:var(--accent);box-shadow:inset 0 0 0 1px var(--line),0 14px 35px rgba(108,77,246,.12);
  margin-bottom:17px
}
.empty-art svg{width:46px;height:46px}
.empty .headline{font-size:1.2rem;font-weight:850;letter-spacing:-.03em}
.empty .sub{font-size:.88rem;color:var(--sub);margin:6px 0 18px}
.empty-add{
  border:0;border-radius:13px;padding:11px 17px;background:var(--accent);color:white;
  font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(108,77,246,.24);transition:.2s
}
.empty-add:hover{transform:translateY(-2px)}
.all-done{padding:25px;text-align:center;color:var(--sub);font-size:.9rem;border:1px dashed var(--line);border-radius:18px}
.fab{
  position:fixed;right:max(24px,calc((100vw - 920px)/2 + 24px));bottom:27px;width:64px;height:64px;
  border:0;border-radius:22px;background:linear-gradient(145deg,var(--accent2),var(--accent));
  color:white;box-shadow:0 16px 34px rgba(82,57,190,.35);cursor:pointer;z-index:5;
  display:grid;place-items:center;transition:.22s
}
.fab:hover{transform:translateY(-4px) rotate(2deg);box-shadow:0 20px 42px rgba(82,57,190,.42)}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}
.overlay,.confirm-overlay{
  position:fixed;inset:0;background:rgba(18,15,32,.52);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s;z-index:10;padding:16px
}
.overlay.open,.confirm-overlay.open{opacity:1;pointer-events:auto}
.sheet{
  width:min(100%,560px);background:var(--solid);border:1px solid var(--line);border-radius:28px;
  padding:25px;box-shadow:0 30px 80px rgba(0,0,0,.22);transform:translateY(40px) scale(.98);transition:.3s
}
.overlay.open .sheet{transform:none}
.sheet-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.sheet-icon{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sheet h2{margin:0;font-size:1.15rem;letter-spacing:-.025em}
.sheet p{margin:3px 0 0;color:var(--sub);font-size:.8rem}
.sheet input{
  width:100%;padding:15px 16px;border-radius:15px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:1rem;outline:none;transition:.2s
}
.sheet input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.error-msg{color:var(--danger);font-size:.78rem;margin:7px 2px 0;min-height:17px}
.sheet-actions,.confirm-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions button,.confirm-actions button{
  flex:1;border:0;padding:12px;border-radius:14px;font-weight:800;cursor:pointer;transition:.2s
}
.btn-cancel{background:var(--bg);color:var(--ink);border:1px solid var(--line)!important}
.btn-save{background:var(--accent);color:#fff;box-shadow:0 9px 20px rgba(108,77,246,.22)}
.btn-danger{background:var(--danger);color:#fff}
.sheet-actions button:hover,.confirm-actions button:hover{transform:translateY(-1px)}
.confirm-overlay{align-items:center}
.confirm-box{
  width:min(100%,360px);background:var(--solid);border:1px solid var(--line);border-radius:24px;padding:23px;
  box-shadow:0 30px 80px rgba(0,0,0,.25);transform:scale(.94);transition:.25s
}
.confirm-overlay.open .confirm-box{transform:scale(1)}
.confirm-box h3{margin:0 0 6px;font-size:1.05rem}
.confirm-box p{margin:0;color:var(--sub);font-size:.84rem}
.toast{
  position:fixed;left:50%;bottom:105px;transform:translate(-50%,12px);
  background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:.82rem;font-weight:750;
  opacity:0;pointer-events:none;transition:.25s;z-index:20;box-shadow:0 10px 28px rgba(0,0,0,.18)
}
.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
@media(max-width:620px){
  .app{padding:16px 14px 110px}
  .hero{padding:22px;border-radius:25px}
  .hero-bottom{align-items:flex-start;flex-direction:column;gap:16px}
  .progress-wrap{width:100%;text-align:left}
  .task{padding:14px 12px;border-radius:17px}
  .fab{right:18px;bottom:20px;width:60px;height:60px;border-radius:20px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="hero-top">
      <div class="brand-row">
        <div class="brand-icon">✓</div>
        <div>
          <h1>My Tasks</h1>
          <div class="subtitle">Stay organized, one task at a time.</div>
        </div>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </div>
    <div class="hero-bottom">
      <div>
        <div class="hero-label">Your progress</div>
        <div class="hero-count" id="heroCount">0</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-text" id="progressText">0% completed</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </section>

  <main class="content">
    <div class="section-heading">
      <h2>Today's Tasks</h2>
      <span class="count" id="taskCount"></span>
    </div>
    <div id="listWrap"></div>
    <div class="clear-row" id="clearRow" style="display:none;">
      <button class="clear-btn" id="clearBtn">Clear Completed</button>
    </div>
  </main>
</div>

<button class="fab" id="fabBtn" aria-label="Add task">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-icon">
        <svg viewBox="0 0 24 24" width="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </div>
      <div>
        <h2>Add a new task</h2>
        <p>What would you like to get done?</p>
      </div>
    </div>
    <input id="taskInput" type="text" placeholder="e.g. Finish my project" maxlength="140" aria-label="What needs to be done?" />
    <div class="error-msg" id="errorMsg"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Add Task</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="deleteConfirm">
  <div class="confirm-box">
    <h3>Delete this task?</h3><p>This action can't be undone.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" id="deleteCancelBtn">Cancel</button>
      <button class="btn-danger" id="deleteConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="clearConfirm">
  <div class="confirm-box">
    <h3>Clear completed tasks?</h3><p>All completed tasks will be removed.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" id="clearCancelBtn">Cancel</button>
      <button class="btn-danger" id="clearConfirmBtn">Clear Completed</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var STORAGE_KEY = 'mytasks.tasks.v1';
  var THEME_KEY = 'mytasks.theme.v1';
  var tasks = [];
  var pendingDeleteId = null;

  function loadTasks(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){ tasks = []; }
  }
  function saveTasks(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    catch(e){ /* storage unavailable, continue in-memory */ }
  }
  function loadTheme(){
    try{
      var theme = localStorage.getItem(THEME_KEY);
      if(theme === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
    }catch(e){}
  }
  function toggleTheme(){
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    try{ localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark'); }catch(e){}
  }

  function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

  var listWrap = document.getElementById('listWrap');
  var taskCount = document.getElementById('taskCount');
  var clearRow = document.getElementById('clearRow');
  var clearBtn = document.getElementById('clearBtn');
  var overlay = document.getElementById('overlay');
  var taskInput = document.getElementById('taskInput');
  var errorMsg = document.getElementById('errorMsg');
  var toast = document.getElementById('toast');
  var deleteConfirm = document.getElementById('deleteConfirm');
  var clearConfirm = document.getElementById('clearConfirm');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }

  function iconTrash(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function taskRow(t){
    return '<div class="task' + (t.completed ? ' done' : '') + '" data-id="' + t.id + '">' +
      '<button class="check" aria-label="' + (t.completed ? 'Mark as not done' : 'Mark as done') + '"></button>' +
      '<div class="title">' + escapeHtml(t.title) + '</div>' +
      '<button class="del" aria-label="Delete task: ' + escapeHtml(t.title) + '">' + iconTrash() + '</button>' +
      '</div>';
  }

  function renderTasks(){
    var pending = tasks.filter(function(t){ return !t.completed; });
    var completed = tasks.filter(function(t){ return t.completed; });

    taskCount.textContent = tasks.length
      ? (pending.length + (pending.length === 1 ? ' pending' : ' pending'))
      : 'No tasks';

    var heroCount = document.getElementById('heroCount');
    var progressFill = document.getElementById('progressFill');
    var progressText = document.getElementById('progressText');
    if(heroCount) heroCount.textContent = tasks.length;
    var pct = tasks.length ? Math.round((completed.length / tasks.length) * 100) : 0;
    if(progressFill) progressFill.style.width = pct + '%';
    if(progressText) progressText.textContent = pct + '% completed';

    if(tasks.length === 0){
      listWrap.innerHTML =
        '<div class="empty">' +
        '<div class="empty-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h3"/><path d="m8 5 1 1 2-2"/></svg></div>' +
        '<div class="headline">Nothing on your list</div>' +
        '<div class="sub">Add your first task and make today productive.</div>' +
        '<button class="empty-add" id="emptyAddBtn">+ Add your first task</button>' +
        '</div>';
      clearRow.style.display = 'none';
      document.getElementById('emptyAddBtn').addEventListener('click', openSheet);
      return;
    }

    var html = '<div class="group-label">Pending</div><div class="list">';
    if(pending.length === 0){
      html += '<div class="all-done">✨ All caught up! You have no pending tasks.</div>';
    } else {
      pending.forEach(function(t){ html += taskRow(t); });
    }
    html += '</div>';

    if(completed.length){
      html += '<div class="group-label">Completed</div><div class="list">';
      completed.forEach(function(t){ html += taskRow(t); });
      html += '</div>';
    }

    listWrap.innerHTML = html;
    clearRow.style.display = completed.length ? 'block' : 'none';

    listWrap.querySelectorAll('.check').forEach(function(el){
      el.addEventListener('click', function(){ toggleTask(el.closest('.task').dataset.id); });
    });
    listWrap.querySelectorAll('.del').forEach(function(el){
      el.addEventListener('click', function(){ askDeleteTask(el.closest('.task').dataset.id); });
    });
  }

  function toggleTask(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if(!t) return;
    t.completed = !t.completed;
    saveTasks();
    renderTasks();
    showToast(t.completed ? 'Task completed ✓' : 'Task reopened');
  }

  function askDeleteTask(id){
    pendingDeleteId = id;
    deleteConfirm.classList.add('open');
  }
  function performDelete(id){
    var el = listWrap.querySelector('[data-id="' + id + '"]');
    function finish(){
      tasks = tasks.filter(function(x){ return x.id !== id; });
      saveTasks();
      renderTasks();
      showToast('Task deleted');
    }
    if(el){
      el.classList.add('removing');
      setTimeout(finish, 160);
    } else {
      finish();
    }
  }

  function addTask(title){
    tasks.unshift({ id: uid(), title: title, completed:false, createdAt: Date.now() });
    saveTasks();
    renderTasks();
  }

  function clearCompletedTasks(){
    tasks = tasks.filter(function(t){ return !t.completed; });
    saveTasks();
    renderTasks();
    showToast('Completed tasks cleared');
  }

  // Add-task sheet
  var savingLock = false;
  function openSheet(){
    errorMsg.textContent = '';
    taskInput.value = '';
    overlay.classList.add('open');
    setTimeout(function(){ taskInput.focus(); }, 150);
  }
  function closeSheet(){ overlay.classList.remove('open'); }

  document.getElementById('fabBtn').addEventListener('click', openSheet);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeSheet(); });

  function trySave(){
    if(savingLock) return;
    var val = taskInput.value.trim();
    if(!val){
      errorMsg.textContent = 'Please enter a task.';
      return;
    }
    savingLock = true;
    addTask(val);
    closeSheet();
    showToast('Task added ✓');
    setTimeout(function(){ savingLock = false; }, 300);
  }
  document.getElementById('saveBtn').addEventListener('click', trySave);
  taskInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') trySave();
    if(e.key === 'Escape') closeSheet();
  });

  // Delete confirm dialog
  document.getElementById('deleteCancelBtn').addEventListener('click', function(){
    pendingDeleteId = null;
    deleteConfirm.classList.remove('open');
  });
  document.getElementById('deleteConfirmBtn').addEventListener('click', function(){
    deleteConfirm.classList.remove('open');
    if(pendingDeleteId){ performDelete(pendingDeleteId); pendingDeleteId = null; }
  });
  deleteConfirm.addEventListener('click', function(e){
    if(e.target === deleteConfirm){ deleteConfirm.classList.remove('open'); pendingDeleteId = null; }
  });

  // Clear-completed confirm dialog
  clearBtn.addEventListener('click', function(){ clearConfirm.classList.add('open'); });
  document.getElementById('clearCancelBtn').addEventListener('click', function(){
    clearConfirm.classList.remove('open');
  });
  document.getElementById('clearConfirmBtn').addEventListener('click', function(){
    clearConfirm.classList.remove('open');
    clearCompletedTasks();
  });
  clearConfirm.addEventListener('click', function(e){
    if(e.target === clearConfirm){ clearConfirm.classList.remove('open'); }
  });

  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  loadTheme();
  loadTasks();
  renderTasks();
})();
</script></script></body></html>
